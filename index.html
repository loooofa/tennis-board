<!doctype html>
<!-- Built by tools/build.js from src/: edit the files in src/, then run `npm run build`. -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ダブルス陣形ボード</title>
<style>
  :root {
    --board: #1c2624;
    --board-2: #243230;
    --panel: #26332f;
    --chalk: #eef2e6;
    --chalk-dim: #a9b5a8;
    --line: rgba(238, 242, 230, 0.16);
    --p1: #f5a524;
    --p2: #ff6f4e;
    --pA: #e0449b;
    --pB: #a57bff;
    --ball: #e4f04a;
    --accent: #d3ec52;
    --danger: #ff7b6b;
    --radius: 10px;
    --court-k: 0.4966; /* drawing width / height (146 / 294) */
  }
  * { box-sizing: border-box; }
  /* Every screen is one page that never scrolls: the court takes the height, the controls fit around it. */
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--board);
    background-image: radial-gradient(ellipse at 30% 0%, var(--board-2), var(--board) 70%);
    color: var(--chalk);
    /* the device's own UI font: nothing to download, works offline, looks like the rest of the phone / PC */
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, "Noto Sans JP", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    height: 100vh; height: 100svh;
    display: flex; flex-direction: column;
    -webkit-tap-highlight-color: transparent;
  }
  button, input, select { font: inherit; color: inherit; }
  h2 { font-weight: 700; margin: 0; font-size: 1.02rem; color: var(--accent); }
  h3 { font-size: .86rem; color: var(--chalk-dim); font-weight: 700; margin: 14px 0 6px; }

  .btn {
    border: 1px solid var(--line); background: rgba(255,255,255,.05);
    border-radius: 8px; padding: 7px 11px; cursor: pointer; min-height: 44px;
    transition: background .15s, border-color .15s;
    white-space: nowrap;
  }
  @media (hover: hover) { .btn:hover:not(:disabled) { background: rgba(255,255,255,.11); } }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn:disabled { opacity: .38; cursor: not-allowed; }
  .btn.primary { background: var(--accent); color: #1b2410; border-color: transparent; font-weight: 700; }
  @media (hover: hover) { .btn.primary:hover:not(:disabled) { background: #e2f47a; } }
  .btn.on { background: var(--ball); color: #1b2410; border-color: transparent; font-weight: 700; }
  .btn.danger { color: var(--danger); }
  .btn.small { padding: 4px 10px; font-size: .88rem; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .seg { display: inline-flex; }
  .seg .btn { border-radius: 0; margin-left: -1px; }
  .seg .btn:first-child { border-radius: 8px 0 0 8px; margin-left: 0; }
  .seg .btn:last-child { border-radius: 0 8px 8px 0; }
  .hint { font-size: .8rem; color: var(--chalk-dim); margin: 8px 0 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
  .sheet-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .sheet-head h2 { flex: 1; }
  /* Long labels on roomy screens, short ones on a phone held upright. */
  .s { display: none; }
  body[data-layout="phone"] .s { display: inline; }
  body[data-layout="phone"] .l { display: none; }
  body:not([data-layout="wide"]) .only-wide { display: none !important; }
  body[data-layout="wide"] .not-wide { display: none !important; }
  body:not(.at-start) .start-only { display: none !important; }

  /* ---- Top bar: point name (tap to rename) + list */
  .topbar { display: flex; align-items: center; gap: 6px; padding: 6px 8px 4px; padding-top: max(6px, env(safe-area-inset-top)); min-width: 0; }
  body[data-layout="phone"] .topbar .btn, body[data-layout="phone"] #point-name { min-height: 40px; }
  #btn-library { font-size: 1.1rem; padding: 4px 10px; }
  #point-name {
    flex: 1; min-width: 0; min-height: 44px; padding: 4px 8px;
    font-weight: 700; font-size: 1.08rem;
    background: transparent; border: 1px solid transparent; border-radius: 8px; text-overflow: ellipsis;
  }
  @media (hover: hover) { #point-name:hover:not(:disabled) { border-color: var(--line); } }
  #point-name:focus { outline: none; border-color: var(--accent); background: rgba(0,0,0,.22); }
  #point-name:disabled { opacity: 1; color: var(--chalk-dim); }

  /* ---- Main area. Default (phone / tablet upright): court, then the shot row and the control row. */
  .app {
    flex: 1; min-height: 0; display: grid; gap: 6px;
    padding: 0 8px 8px; padding-bottom: max(8px, env(safe-area-inset-bottom));
    grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto;
    grid-template-areas: "court" "panel";
  }
  .court-card { grid-area: court; min-height: 0; min-width: 0; position: relative; }
  #court { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
  .piece { cursor: grab; }
  .piece.dragging { cursor: grabbing; }
  #court.playing .piece { cursor: inherit; }
  #caption {
    /* Sits in the strip above the far baseline, clear of the ball's path over the net. */
    position: absolute; left: 50%; top: 6px; transform: translateX(-50%); z-index: 2;
    max-width: calc(100% - 16px); width: max-content; text-align: center; pointer-events: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    background: rgba(20, 28, 26, .8); border: 1px solid var(--line); border-radius: 8px;
    padding: 2px 9px; font-size: .8rem; font-weight: 700; line-height: 1.4;
  }
  #caption[hidden] { display: none; }
  /* Step hints are secondary: small and see-through so a player behind the far baseline still shows. */
  #caption.hint-cap { font-weight: 500; font-size: .72rem; padding: 1px 8px; color: var(--chalk-dim);
    background: rgba(20, 28, 26, .35); border-color: transparent; text-shadow: 0 1px 2px rgba(0, 0, 0, .8); }

  .panel { grid-area: panel; display: flex; flex-direction: column; gap: 6px; min-width: 0; min-height: 0; }
  .shot-card, .nav-card { padding: 0; border: 0; background: none; }
  .shot-row { display: flex; flex-wrap: nowrap; gap: 4px; }
  .shot-row[hidden] { display: none !important; }
  .shot-row .seg { flex: 1 1 0; min-width: 0; display: flex; }
  #serve-row .seg { flex: 3.2 1 0; }
  #serve-row #btn-hand { flex: .8 1 0; min-width: 0; padding: 4px 2px; }
  #serve-row #btn-side { flex: 1.3 1 0; min-width: 0; padding: 4px 2px; }
  .shot-row .seg .btn { flex: 1 1 0; min-width: 0; padding: 4px 2px; }

  /* [… ][◀][n打目][▶][▶ 再生][＋ 次の打球]: the most used button sits under the right thumb. */
  .nav-row { display: flex; flex-wrap: nowrap; gap: 4px; align-items: center; }
  .nav-row .btn { flex: 1 1 0; min-width: 0; min-height: 46px; padding: 4px; overflow: hidden; text-overflow: ellipsis; }
  .nav-row #btn-more { flex: .8 1 0; font-size: 1.15rem; font-weight: 700; letter-spacing: .06em; }
  .nav-row #btn-play { flex: 1.5 1 0; }
  .nav-row #btn-add-frame { flex: 2.1 1 0; }
  .frame-info { flex: 1.3 1 0; min-width: 0; text-align: center; line-height: 1.1; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .frame-info .of { font-weight: 500; color: var(--chalk-dim); margin-left: 3px; font-size: .85em; }
  .frame-info .start-label { font-size: .85em; }
  body[data-layout="phone"] .frame-info .of { display: none; }
  .frames-strip { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; min-height: 28px; }
  .frame-dot {
    min-width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--line);
    background: transparent; cursor: pointer; font-size: .82rem; font-variant-numeric: tabular-nums;
  }
  .frame-dot.cur { background: var(--ball); color: #1b2410; border-color: transparent; font-weight: 700; }
  .frames-empty { color: var(--chalk-dim); font-size: .82rem; }

  /* ---- 「…」 menu: rarely used actions. The ones used most sit lowest, nearest the thumb. */
  .menu-items { display: grid; gap: 6px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .menu-items .full { grid-column: 1 / -1; }
  .menu-items .btn { text-align: left; overflow: hidden; text-overflow: ellipsis; }
  .menu-items .ic { display: inline-block; width: 1.3em; text-align: center; margin-right: 2px; }
  .speed-row { display: flex; align-items: center; gap: 8px; }
  .speed-row .label { font-size: .85rem; color: var(--chalk-dim); white-space: nowrap; }
  .speed-row .seg { flex: 1; display: flex; }
  .speed-row .seg .btn { flex: 1 1 0; min-width: 0; padding: 4px 2px; font-variant-numeric: tabular-nums; text-align: center; }

  /* ---- 陣形 (start arrangements, shown only on the スタート step) */
  .preset-group { margin-bottom: 8px; display: flex; gap: 8px; align-items: flex-start; }
  .preset-group .label { font-size: .78rem; color: var(--chalk-dim); width: 5.4em; flex: none; padding-top: 10px; line-height: 1.3; }
  .preset-group .row { flex: 1; min-width: 0; }
  .btn.preset.active { border-color: var(--accent); color: var(--accent); }
  /* a phone held sideways: two columns so it all fits the height */
  body[data-layout="land"] #presets { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 12px; }
  body[data-layout="land"] #presets > :first-child, body[data-layout="land"] #presets > .people-hint { grid-column: 1 / -1; }
  body[data-layout="land"] #presets > .formations { grid-column: 1 / -1; order: 2; }
  body[data-layout="land"] #presets > .mine-group { order: 1; }
  body[data-layout="land"] #presets .people-hint { margin: 0; order: 3; }
  body[data-layout="land"] #presets .preset-group { margin-bottom: 6px; }
  .mine { display: inline-flex; }
  .mine .preset { border-radius: 8px 0 0 8px; }
  .mine .del { border-radius: 0 8px 8px 0; margin-left: -1px; padding: 4px 8px; }
  .preset-empty { font-size: .8rem; color: var(--chalk-dim); }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: .82rem; color: var(--chalk-dim); margin-top: 10px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 3px; vertical-align: -1px; }
  .legend i + span { margin-left: 2px; }

  /* ---- Point list */
  .saved-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; grid-template-columns: minmax(0, 1fr); }
  .saved-list li {
    display: flex; align-items: center; gap: 6px; padding: 5px 6px 5px 10px;
    border: 1px solid var(--line); border-radius: 8px; background: rgba(0,0,0,.12);
  }
  .saved-list li.current { border-color: var(--accent); }
  .saved-list li.child { margin-left: 16px; }
  .saved-list .open { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 2px 0; cursor: pointer; }
  .saved-list .open:disabled { cursor: default; }
  .saved-list .name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .saved-list .meta { display: block; font-size: .74rem; color: var(--chalk-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .saved-list .tag { font-size: .7rem; color: #1b2410; background: var(--accent); border-radius: 4px; padding: 0 5px; margin-right: 6px; font-weight: 700; }
  .saved-list .btn.small { padding: 4px 8px; font-size: .84rem; flex: none; }
  .saved-list .empty { color: var(--chalk-dim); font-size: .85rem; border-style: dashed; justify-content: center; }

  /* ---- Overlays (list, 陣形, 「…」): a bottom sheet on a phone, a drawer / small pop-up on tablets
     and phones held sideways, and plain columns / cards on a wide screen. */
  body:not([data-layout="wide"]) .overlay {
    position: fixed; z-index: 20; overflow-y: auto; overscroll-behavior: contain;
    visibility: hidden; box-shadow: 0 8px 30px rgba(0,0,0,.45);
  }
  body[data-layout="phone"] .overlay {
    left: 0; right: 0; bottom: 0; max-height: 85vh; max-height: 85svh;
    border-radius: 14px 14px 0 0; padding: 12px 12px max(14px, env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform .22s ease, visibility 0s .22s;
  }
  body[data-layout="phone"] .overlay.open { transform: none; visibility: visible; transition: transform .22s ease; }
  body[data-layout="tall"] .overlay, body[data-layout="land"] .overlay { opacity: 0; transition: opacity .15s, visibility 0s .15s; }
  body[data-layout="tall"] .overlay.open, body[data-layout="land"] .overlay.open { opacity: 1; visibility: visible; transition: opacity .15s; }
  body[data-layout="tall"] #library, body[data-layout="land"] #library {
    left: 0; top: 0; bottom: 0; width: min(380px, 92vw); border-radius: 0 14px 14px 0;
    padding-top: max(12px, env(safe-area-inset-top));
  }
  #backdrop { display: none; }
  #backdrop.open { display: block; position: fixed; inset: 0; z-index: 19; }
  #backdrop.dim { background: rgba(0,0,0,.5); }
  body[data-layout="phone"] .overlay input { font-size: 16px; } /* prevents iOS zoom on focus */

  /* Phone held sideways / small tablet landscape: court on the left, everything else on the right. */
  body[data-layout="land"] {
    display: grid; gap: 6px 10px; padding: 8px; padding-right: max(8px, env(safe-area-inset-right)); padding-left: max(8px, env(safe-area-inset-left));
    grid-template-columns: calc((100vh - 16px) * var(--court-k)) minmax(0, 1fr);
    grid-template-columns: calc((100svh - 16px) * var(--court-k)) minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "court top" "court panel";
  }
  body[data-layout="land"] .app, body[data-layout="wide"] .app { display: contents; }
  body[data-layout="land"] .topbar, body[data-layout="wide"] .topbar { grid-area: top; padding: 0; }
  body[data-layout="land"] .panel { justify-content: flex-end; }

  /* Tablet landscape / PC: list | court | controls, nothing hidden behind 「…」. */
  body[data-layout="wide"] {
    display: grid; gap: 8px 14px; padding: 10px 14px; justify-content: center;
    grid-template-columns: 320px calc((100vh - 20px) * var(--court-k)) minmax(340px, 540px);
    grid-template-columns: 320px calc((100svh - 20px) * var(--court-k)) minmax(340px, 540px);
    grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "list court top" "list court panel";
  }
  body[data-layout="wide"].list-collapsed {
    grid-template-columns: calc((100vh - 20px) * var(--court-k)) minmax(340px, 540px);
    grid-template-columns: calc((100svh - 20px) * var(--court-k)) minmax(340px, 540px);
    grid-template-areas: "court top" "court panel";
  }
  body[data-layout="wide"].list-collapsed #library { display: none; }
  body[data-layout="wide"] #library { grid-area: list; min-height: 0; overflow-y: auto; }
  body[data-layout="wide"] .panel { overflow-y: auto; gap: 10px; }
  body[data-layout="wide"] .nav-row #btn-add-frame { flex: 2.8 1 0; }
  body[data-layout="wide"] .shot-card, body[data-layout="wide"] .nav-card { padding: 12px; border: 1px solid var(--line); background: var(--panel); }
  body[data-layout="wide"] .card > h2 { margin-bottom: 8px; }
  body[data-layout="wide"]:not(.at-start) #presets-card { display: none; }
  body:not([data-layout="phone"]) .shot-row .btn { min-height: 44px; }
  body[data-layout="phone"] .shot-row .btn { min-height: 40px; }
  body[data-layout="phone"] .saved-list .btn.small, body[data-layout="phone"] .preset-group .btn { min-height: 36px; }

  #toast {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(20px);
    background: var(--chalk); color: #1b2410; padding: 8px 14px; border-radius: 8px;
    font-weight: 700; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
    max-width: calc(100vw - 32px); text-align: center; z-index: 30;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  body[data-layout="phone"] #toast { font-size: .8rem; padding: 6px 10px; bottom: auto; top: 50px; transform: translateX(-50%) translateY(-10px); }
  body[data-layout="phone"] #toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body data-layout="phone">
<header class="topbar">
  <button class="btn" id="btn-library" aria-label="ポイント一覧" title="ポイント一覧" data-i18n-aria="list.title" data-i18n-title="list.title">☰</button>
  <input id="point-name" type="text" maxlength="40" aria-label="ポイントの名前(タップで変更)" title="タップして名前を変更" data-i18n-aria="name.aria" data-i18n-title="name.title">
  <button class="btn small start-only not-wide" id="btn-presets" title="スタートの並びを陣形から選ぶ" data-i18n-title="presets.pick" data-i18n="presets.button">陣形</button>
</header>

<main class="app">
  <aside class="card overlay library" id="library" aria-label="ポイント一覧" data-i18n-aria="list.title">
    <div class="sheet-head">
      <h2 data-i18n="list.title">ポイント一覧</h2>
      <button class="btn small primary" id="btn-new-point" data-i18n="list.new">＋ 新規</button>
      <button class="btn small not-wide" data-close data-i18n="close">閉じる</button>
    </div>
    <p class="hint" style="margin:0 0 8px" data-i18n="list.hint">自動で保存されます。名前をタップで開きます。</p>
    <ul class="saved-list" id="list-points"></ul>
    <h3 data-i18n="list.samples">サンプル(見るだけ。編集すると一覧にコピー)</h3>
    <ul class="saved-list" id="list-samples"></ul>
  </aside>

  <div class="court-card">
    <div id="caption" hidden></div>
    <svg id="court" viewBox="-18 -28 146 294" aria-label="テニスコート" data-i18n-aria="court">
      <defs>
        <marker id="mk-ball" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#e4f04a"/>
        </marker>
      </defs>
      <rect id="court-bg" x="-18" y="-28" width="146" height="294" fill="#255b58" rx="4"/>
      <g id="court-lines"></g>
      <g id="layer-moves"></g>
      <g id="layer-trail"></g>
      <g id="layer-pieces"></g>
    </svg>
  </div>

  <div class="panel">
    <section class="card overlay presets-card" id="presets-card" aria-label="陣形" data-i18n-aria="presets.button">
      <div class="sheet-head">
        <h2 data-i18n="presets.title">陣形(スタートの並び)</h2>
        <button class="btn small not-wide" data-close data-i18n="close">閉じる</button>
      </div>
      <div id="presets"></div>
    </section>

    <section class="card shot-card" aria-label="この打球のショット" data-i18n-aria="shot.aria">
      <h2 class="only-wide" id="shot-title">この打球</h2>
      <div class="row shot-row" id="rally-row">
        <div class="seg" role="group" aria-label="球種" data-i18n-aria="shot.kind">
          <button class="btn small" data-shot="normal" data-i18n="shot.normal">通常</button>
          <button class="btn small" data-shot="lob" data-i18n="shot.lob">ロブ</button>
          <button class="btn small" data-shot="hard" data-i18n="shot.hard">強打</button>
        </div>
      </div>
      <div class="row shot-row" id="serve-row" hidden>
        <div class="seg" role="group" aria-label="サーブの種類" data-i18n-aria="serve.kind">
          <button class="btn small" data-serve="flat" data-i18n="shot.flat">フラット</button>
          <button class="btn small" data-serve="slice" data-i18n="shot.slice">スライス</button>
          <button class="btn small" data-serve="kick" data-i18n="shot.kick">キック</button>
        </div>
        <button class="btn small" id="btn-hand" aria-label="利き手" data-i18n-aria="serve.hand"></button>
        <button class="btn small" id="btn-side" aria-label="デュース/アド" data-i18n-aria="serve.side"></button>
      </div>
    </section>

    <section class="card nav-card" aria-label="打球の送り・再生" data-i18n-aria="nav.aria">
      <div class="nav-row">
        <button class="btn not-wide" id="btn-more" aria-label="その他の操作" title="その他の操作" data-i18n-aria="menu.title" data-i18n-title="menu.title">…</button>
        <button class="btn" id="btn-prev" aria-label="前の打球へ" title="前の打球へ(←)" data-i18n-aria="nav.prev" data-i18n-title="nav.prevKey">◀</button>
        <span class="frame-info" id="frame-info"></span>
        <button class="btn" id="btn-next" aria-label="次の打球へ" title="次の打球へ(→)" data-i18n-aria="nav.next" data-i18n-title="nav.nextKey">▶</button>
        <button class="btn on" id="btn-play" title="再生 / 停止(Space)" data-i18n-title="nav.playKey">▶ 再生</button>
        <button class="btn primary" id="btn-add-frame" title="次の打球を追加(Enter)" data-i18n-title="nav.addKey"></button>
      </div>
      <div class="frames-strip only-wide" id="frames-strip"></div>
    </section>

    <section class="card overlay menu" id="menu" aria-label="その他の操作" data-i18n-aria="menu.title">
      <h2 class="only-wide" data-i18n="menu.title">その他の操作</h2>
      <div class="menu-items">
        <button class="btn full start-only not-wide" id="btn-menu-save-formation"><span class="ic">＋</span><span data-i18n="presets.saveLong">今の並びをマイ陣形に保存</span></button>
        <button class="btn" id="btn-export" title="表示中のポイントを文字にしてコピーする(送ったり、残しておいたりできる)" data-i18n-title="menu.exportTitle"><span class="ic">⇪</span><span data-i18n="menu.export">書き出す</span></button>

        <div class="speed-row full">
          <span class="label" data-i18n="menu.speed">再生速度</span>

          <span class="label" data-i18n="menu.autoShift" title="打った側はボールの行った側へ、受ける側のパートナーは返球する人について、横に一緒にずれる" data-i18n-title="menu.autoShiftTitle">ペアの平行移動</span>

          <span class="label" data-i18n="menu.lang">言語</span>

        <button class="btn" id="btn-reset-point" title="今のスタートの並びから新しいポイントを作る(今のポイントは一覧に残ります)" data-i18n-title="menu.newTitle"><span class="ic">＋</span><span data-i18n="menu.new">新規ポイント</span></button>
        <button class="btn danger" id="btn-del-frame" title="表示中の打球を削除" data-i18n-title="menu.delTitle"><span class="ic">−</span><span data-i18n="menu.del">この打球を削除</span></button>

      </div>
      <p class="hint only-wide" id="mode-hint"></p>
      <p class="hint only-wide" data-i18n="menu.keys">キーボード:← → 打球の送り / Space 再生・停止 / Enter 次の打球</p>
      <div class="legend only-wide">
        <span><i style="background:var(--p1)"></i><i style="background:var(--p2)"></i><span data-i18n="legend.own">自分たち(1・2)</span></span>
        <span><i style="background:var(--pA)"></i><i style="background:var(--pB)"></i><span data-i18n="legend.opp">相手(A・B)</span></span>
        <span><i style="background:var(--ball)"></i><span data-i18n="legend.ball">ボール</span></span>
      </div>
    </section>
  </div>
</main>
<div id="backdrop"></div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  // Small pure helpers shared by the model and the screen.
  // ---- Small helpers
  const ptOrNull = (v) => (v && isFinite(v.x) && isFinite(v.y) ? { x: +v.x, y: +v.y } : null);
  // Lines stay this far inside the drawing so their arrowheads fit.
  const EDGE = 4;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  const clone = (o) => JSON.parse(JSON.stringify(o));
  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);

  // Court geometry, pieces and shot kinds (1 unit = 10cm).
  // ---- Geometry (1 unit = 10cm). Doubles court 10.97m x 23.77m. Our side is the bottom half.
  const W = 109.7, L = 237.7, NET = L / 2, ALLEY = 13.7, SVC = 64;
  const VB = { x: -18, y: -28, w: 146, h: 294 };
  const R_PLAYER = 7.5, R_BALL = 3.6;
  const COLORS = { own: '#f5a524', opp: '#e0449b', ball: '#e4f04a', chalk: '#eef2e6', court: '#2f7470' };
  // Each player their own colour, in the warm (us) or pink-violet (them) range of their team.
  const PLAYER_COLORS = { p1: '#f5a524', p2: '#ff6f4e', A: '#e0449b', B: '#a57bff' };
  const PIECES = [
    { id: 'p1', team: 'own', label: '1' },
    { id: 'p2', team: 'own', label: '2' },
    { id: 'A', team: 'opp', label: 'A' },
    { id: 'B', team: 'opp', label: 'B' },
    { id: 'ball', team: 'ball', label: '' },
  ];
  const PLAYERS = PIECES.filter((p) => p.id !== 'ball');
  // A frame is the moment someone hits the ball; its `shot` describes that hit (names in strings.js: shot.<kind>).
  // ms = flight time to the next hitter, peak = height of the arc before / after the bounce.
  const SHOT_TYPES = {
    normal: { ms: 1000, peak: [0.35, 0.15] },
    lob:    { ms: 1700, peak: [1, 0.3] },
    hard:   { ms: 620,  peak: [0.12, 0.06] },
    // Serves (1打目 only). Kick is slower and jumps high after the bounce; flat and slice stay low.
    flat:   { ms: 760,  peak: [0.2, 0.1] },
    slice:  { ms: 900,  peak: [0.26, 0.06] },
    kick:   { ms: 1100, peak: [0.38, 0.45] },
  };

  // Players stay in their own half: ours below the net, theirs above it (a little short of the net).
  const NET_GAP = 2;
  const TEAM_OF = Object.fromEntries(PIECES.map((p) => [p.id, p.team]));
  function keepOnSide(team, pos) {
    if (team === 'own') return pos.y < NET + NET_GAP ? { x: pos.x, y: NET + NET_GAP } : pos;
    if (team === 'opp') return pos.y > NET - NET_GAP ? { x: pos.x, y: NET - NET_GAP } : pos;
    return pos;
  }
  // The same for every player of a set of positions (returns a new object).
  function keepSidesOf(set) {
    const out = { ...set };
    for (const p of PLAYERS) if (out[p.id]) out[p.id] = keepOnSide(p.team, out[p.id]);
    return out;
  }

  // Serve rules: legal serving spot, service box, deuce / ad, serve shapes. See CLAUDE.md.

  // ---- Serve (1打目 is always a serve). See CLAUDE.md for the rules.
  const SERVE_KINDS = ['flat', 'slice', 'kick'];
  const DEG = Math.PI / 180;
  // Shape for a right-hander, relative to the server's right; left-handers mirror it.
  // bendK: sideways curve in the air (control point offset / length; + = bulges to the server's right,
  // so a ball curving LEFT bulges right), turn: change of direction at the bounce (+ = to the right),
  // extK: length after the bounce (/ length before it).
  const SERVE_SHAPES = {
    flat:  { bendK: 0,    turn: 0,         extK: 0.45 }, // straight and long
    slice: { bendK: 0.18, turn: -15 * DEG, extK: 0.32 }, // curves left, keeps sliding left
    kick:  { bendK: 0.07, turn: 20 * DEG,  extK: 0.26 }, // curves a little left, jumps right
  };
  const serveShape = (kind, hand) => {
    const sh = SERVE_SHAPES[kind], m = hand === 'L' ? -1 : 1;
    return { bendK: sh.bendK * m, turn: sh.turn * m, extK: sh.extK };
  };
  const isServe = (st) => !!(st && st.shot && st.shot.serve);
  const servesUp = (ball) => ball.y > NET; // our pair (bottom) serves towards the top
  // Deuce = the server's right of the centre mark; facing up that is the right half of the drawing.
  const guessSide = (ball) => ((servesUp(ball) ? ball.x >= W / 2 : ball.x <= W / 2) ? 'deuce' : 'ad');
  // The serve is hit from behind the baseline, between the centre mark and the doubles sideline, and the
  // server stands there until it is hit. up = the serving pair is ours (bottom, serving up the drawing).
  function clampServeSpot(side, up, pos) {
    const rightHalf = (side === 'deuce') === up;
    return {
      x: rightHalf ? clamp(pos.x, W / 2, W) : clamp(pos.x, 0, W / 2),
      y: up ? clamp(pos.y, L, VB.y + VB.h - 3) : clamp(pos.y, VB.y + 3, 0),
    };
  }
  // The serve ball: which pair serves follows from which side of the net it is on.
  const clampServeBall = (side, pos) => clampServeSpot(side, servesUp(pos), pos);
  // The server: the player of the serving pair closest to the serve ball.
  function serverId(st) {
    const team = servesUp(st.pieces.ball) ? 'own' : 'opp';
    let best = null, bestD = Infinity;
    for (const p of PLAYERS) {
      if (p.team !== team) continue;
      const d = Math.hypot(st.pieces[p.id].x - st.pieces.ball.x, st.pieces[p.id].y - st.pieces.ball.y);
      if (d < bestD) { best = p.id; bestD = d; }
    }
    return best;
  }
  // It must land in the diagonal service box (singles width, lines are in).
  function serveBox(st) {
    const up = servesUp(st.pieces.ball), leftHalf = (st.shot.serve.side === 'deuce') === up;
    return { x0: leftHalf ? ALLEY : W / 2, x1: leftHalf ? W / 2 : W - ALLEY, y0: up ? NET - SVC : NET, y1: up ? NET : NET + SVC };
  }
  function clampLand(st, pos) {
    const b = serveBox(st);
    return { x: clamp(pos.x, b.x0, b.x1), y: clamp(pos.y, b.y0, b.y1) };
  }
  // Make a state the serve: give it serve settings if it has none, and keep the ball and × legal.
  function ensureServe(st) {
    const sh = st.shot;
    if (!sh.serve) {
      const kind = SERVE_KINDS.includes(sh.type) ? sh.type : 'flat';
      sh.type = kind;
      sh.serve = { hand: 'R', side: guessSide(st.pieces.ball), ...serveShape(kind, 'R') };
    }
    st.pieces.ball = clampServeBall(sh.serve.side, st.pieces.ball);
    sh.land = clampLand(st, sh.land);
    return st;
  }
  const stripCatch = (st) => { delete st.catch; delete st.start; };
  function stripServe(st) {
    if (!st.shot.serve) return;
    delete st.shot.serve;
    if (SERVE_KINDS.includes(st.shot.type)) st.shot.type = 'normal';
  }
  // Deuce <-> ad: the serving pair mirrors left-right; the receiving pair keeps its sides and swaps
  // front and back (the other receiver now returns). The ball and × mirror too; the spin does not.
  function flipServeSide(f) {
    const up = servesUp(f.pieces.ball), servingTeam = up ? 'own' : 'opp';
    const receivers = PLAYERS.filter((p) => p.team !== servingTeam).map((p) => p.id);
    for (const set of [f.pieces, f.start].filter(Boolean)) {
      for (const p of PLAYERS) if (p.team === servingTeam) set[p.id] = { x: W - set[p.id].x, y: set[p.id].y };
      const [r1, r2] = receivers, y1 = set[r1].y;
      set[r1] = { x: set[r1].x, y: set[r2].y };
      set[r2] = { x: set[r2].x, y: y1 };
    }
    f.pieces.ball = { x: W - f.pieces.ball.x, y: f.pieces.ball.y };
    f.shot.land = { x: W - f.shot.land.x, y: f.shot.land.y };
    f.shot.serve.side = f.shot.serve.side === 'deuce' ? 'ad' : 'deuce';
    ensureServe(f);
  }

  // A shot's simulated line (hit -> × -> straight on) and where on it the next ball is taken.

  // ---- Shot line
  // A shot is a simulated line: hit -> × (leg 0) and, if it bounces, × -> straight on (leg 1, 30% of leg 0 per unit t).
  // The next frame returns the ball somewhere on it: catch = { leg, t }. Taking it on leg 0 of a bouncing
  // shot means a volley before the bounce. Leg 1 may run past its drawn end (t > 1) for a deeper return.
  const EXT_K = 0.3, T_MAX1 = 3;
  const fullCatch = (st) => (st.shot.bounce ? { leg: 1, t: 1 } : { leg: 0, t: 1 });
  const unit = (v) => { const l = Math.hypot(v.x, v.y) || 1; return { x: v.x / l, y: v.y / l }; };
  const rightOf = (u) => ({ x: -u.y, y: u.x }); // right-hand side of travel (drawing y points down)
  // Shape of a shot: leg 0 hit -> × (straight, or a curve for a serve), leg 1 from × in `dir` for len1 per t.
  function geom(st) {
    const a = st.pieces.ball, b = st.shot.land;
    const L0 = Math.hypot(b.x - a.x, b.y - a.y) || 1, u = { x: (b.x - a.x) / L0, y: (b.y - a.y) / L0 };
    if (!isServe(st)) return { a, b, ctrl: null, dir: u, len1: EXT_K * L0, L0 };
    const sv = st.shot.serve, r = rightOf(u);
    const ctrl = sv.bendK ? { x: (a.x + b.x) / 2 + r.x * sv.bendK * L0, y: (a.y + b.y) / 2 + r.y * sv.bendK * L0 } : null;
    const inc = ctrl ? unit({ x: b.x - ctrl.x, y: b.y - ctrl.y }) : u, ri = rightOf(inc);
    const c = Math.cos(sv.turn), sn = Math.sin(sv.turn);
    return { a, b, ctrl, inc, dir: { x: inc.x * c + ri.x * sn, y: inc.y * c + ri.y * sn }, len1: sv.extK * L0, L0 };
  }
  function leg0At(g, t) {
    if (!g.ctrl) return { x: lerp(g.a.x, g.b.x, t), y: lerp(g.a.y, g.b.y, t) };
    const k0 = (1 - t) * (1 - t), k1 = 2 * (1 - t) * t, k2 = t * t;
    return { x: k0 * g.a.x + k1 * g.ctrl.x + k2 * g.b.x, y: k0 * g.a.y + k1 * g.ctrl.y + k2 * g.b.y };
  }
  // How far leg 1 can run (in t) before leaving the drawing: it is shortened there, never bent.
  function tMax1(st, g = geom(st)) {
    const b = g.b, d = { x: g.dir.x * g.len1, y: g.dir.y * g.len1 };
    let t = T_MAX1;
    const lim = (pos, dir, lo, hi) => { if (dir > 0) t = Math.min(t, (hi - pos) / dir); else if (dir < 0) t = Math.min(t, (lo - pos) / dir); };
    lim(b.x, d.x, VB.x + EDGE, VB.x + VB.w - EDGE);
    lim(b.y, d.y, VB.y + EDGE, VB.y + VB.h - EDGE);
    return Math.max(0, t);
  }
  function catchPoint(st, c) {
    const g = geom(st);
    if (c.leg === 0) return leg0At(g, c.t);
    const t = Math.min(c.t, tMax1(st, g));
    return { x: g.b.x + g.dir.x * g.len1 * t, y: g.b.y + g.dir.y * g.len1 * t };
  }
  // The other pair can only play the ball once it has crossed the net: the share of leg 0 before that
  // (0 when leg 0 does not cross it). Serves are only returned after the bounce anyway.
  function netT(st) {
    const a = st.pieces.ball, b = st.shot.land;
    if (isServe(st) || (a.y > NET) === (b.y > NET) || a.y === b.y) return 0;
    return Math.ceil(((NET - a.y) / (b.y - a.y)) * 1000) / 1000;
  }
  // Nearest point of the shot's line to pos, where the next ball may be taken: after the net, and for a
  // serve only after it bounces.
  function projectCatch(st, pos) {
    const g = geom(st);
    let best = null;
    if (!isServe(st)) {
      if (!g.ctrl) {
        const dx = g.b.x - g.a.x, dy = g.b.y - g.a.y, L2 = dx * dx + dy * dy, t0 = netT(st);
        const t = L2 ? clamp(((pos.x - g.a.x) * dx + (pos.y - g.a.y) * dy) / L2, t0, 1) : t0;
        best = { leg: 0, t, d: Math.hypot(g.a.x + dx * t - pos.x, g.a.y + dy * t - pos.y) };
      } else {
        for (let i = 0; i <= 60; i++) {
          const q = leg0At(g, i / 60), d = Math.hypot(q.x - pos.x, q.y - pos.y);
          if (!best || d < best.d) best = { leg: 0, t: i / 60, d };
        }
      }
    }
    if (st.shot.bounce) {
      const dx = g.dir.x * g.len1, dy = g.dir.y * g.len1, L2 = dx * dx + dy * dy;
      const t = L2 ? clamp(((pos.x - g.b.x) * dx + (pos.y - g.b.y) * dy) / L2, 0, tMax1(st, g)) : 0;
      const d = Math.hypot(g.b.x + dx * t - pos.x, g.b.y + dy * t - pos.y);
      if (!best || d < best.d) best = { leg: 1, t, d };
    }
    const t = Math.round(best.t * 1000) / 1000;
    return { leg: best.leg, t: best.leg === 0 ? Math.max(t, netT(st)) : t };
  }
  // A return point the rules allow: a serve only after its bounce, any other ball only after the net.
  function validCatch(st, c) {
    if (!(c && ((c.leg === 0 && !isServe(st)) || (c.leg === 1 && st.shot.bounce)))) return fullCatch(st);
    const t0 = netT(st);
    return c.leg === 0 && c.t < t0 ? { leg: 0, t: t0 } : c;
  }
  // Frames before this model stored only the return point: put × on the line to it so it stays put.
  function fixCatches(fr) {
    if (fr[0]) { delete fr[0].catch; ensureServe(fr[0]); }
    for (let k = 1; k < fr.length; k++) {
      const a = fr[k - 1], f = fr[k];
      stripServe(f);
      if (!f.catch && isServe(a)) {
        // Put × (inside the box) on the line to the old return point, then take the return after the bounce.
        const hit = a.pieces.ball, nb = f.pieces.ball;
        a.shot.land = clampLand(a, { x: lerp(hit.x, nb.x, 0.65), y: lerp(hit.y, nb.y, 0.65) });
        f.catch = projectCatch(a, nb);
      }
      if (!f.catch) {
        const hit = a.pieces.ball, nb = f.pieces.ball, L = Math.hypot(nb.x - hit.x, nb.y - hit.y) || 1;
        if (!a.shot.volley) {
          const b = a.shot.land;
          const t = Math.max(0.3, Math.min(0.97, ((b.x - hit.x) * (nb.x - hit.x) + (b.y - hit.y) * (nb.y - hit.y)) / (L * L)));
          a.shot.land = { x: lerp(hit.x, nb.x, t), y: lerp(hit.y, nb.y, t) };
          const ext = EXT_K * t * L;
          f.catch = { leg: 1, t: ext > 0 ? Math.min(T_MAX1, ((1 - t) * L) / ext) : 1 };
        } else {
          a.shot.land = { ...nb };
          f.catch = { leg: 0, t: 1 };
        }
      }
      f.catch = validCatch(a, f.catch);
      f.pieces.ball = catchPoint(a, f.catch);
    }
    for (const f of fr) delete f.shot.volley;
    return fr;
  }


  // ◇: the curve's control point sits twice as far from the chord as its midpoint.
  function setServeBend(st, pos) {
    const a = st.pieces.ball, b = st.shot.land, L0 = Math.hypot(b.x - a.x, b.y - a.y) || 1;
    const r = rightOf({ x: (b.x - a.x) / L0, y: (b.y - a.y) / L0 });
    const k = (2 * ((pos.x - (a.x + b.x) / 2) * r.x + (pos.y - (a.y + b.y) / 2) * r.y)) / L0;
    st.shot.serve.bendK = Math.abs(k) < 0.02 ? 0 : Math.round(clamp(k, -0.45, 0.45) * 1000) / 1000;
  }
  // ○: direction (turn from the incoming path) and length of the line after the bounce.
  function setServeAfter(st, pos) {
    const g = geom(st), v = { x: pos.x - g.b.x, y: pos.y - g.b.y }, ri = rightOf(g.inc);
    const turn = Math.atan2(v.x * ri.x + v.y * ri.y, v.x * g.inc.x + v.y * g.inc.y);
    st.shot.serve.turn = Math.round(clamp(turn, -80 * DEG, 80 * DEG) * 1000) / 1000;
    st.shot.serve.extK = Math.round(clamp(Math.hypot(v.x, v.y) / g.L0, 0.05, 1.2) * 1000) / 1000;
  }

  // Saved data: normalising, migrating older formats.

  function normalize(s) {
    const out = { pieces: keepSidesOf(clone(s.pieces)) }; // a player over the net goes back to their side
    const sh = s.shot || {};
    // land (×): where the ball bounces, or where the next player takes it out of the air when bounce is off.
    // Older data stored the bounce point as `bounce` and a volley target as `after`; curves are dropped.
    const oldBounce = ptOrNull(sh.bounce);
    const land = ptOrNull(sh.land) || oldBounce || ptOrNull(sh.after) || defaultBounce(out.pieces.ball);
    out.shot = {
      type: SHOT_TYPES[sh.type] ? sh.type : 'normal',
      land,
      bounce: true,
    };
    // Older data could mark a shot as taken in the air; fixCatches turns that into a return before ×.
    if (sh.bounce === false || (!sh.land && !oldBounce)) out.shot.volley = true;
    const sv = sh.serve;
    if (sv && SERVE_KINDS.includes(sh.type)) {
      const num = (v, d) => (isFinite(v) ? +v : d);
      out.shot.serve = { hand: sv.hand === 'L' ? 'L' : 'R', side: sv.side === 'ad' ? 'ad' : 'deuce',
        bendK: num(sv.bendK, 0), turn: num(sv.turn, 0), extK: num(sv.extK, 0.45) };
    }
    if (typeof s.note === 'string' && s.note.trim()) out.note = s.note.trim().slice(0, 80);
    if (s.start && PLAYERS.every((p) => ptOrNull(s.start[p.id]))) out.start = keepSidesOf(playersOf(s.start));
    if (s.catch && (s.catch.leg === 0 || s.catch.leg === 1) && isFinite(s.catch.t)) out.catch = { leg: s.catch.leg, t: +s.catch.t };
    // players whose move during this shot is automatic (see autoMoves); older data has none
    if (Array.isArray(s.autoMove)) out.autoMove = PLAYERS.map((p) => p.id).filter((id) => s.autoMove.includes(id));
    if (s.autoOn === true) out.autoOn = true; // its automatic moves have been worked out (after the line was placed)
    return out;
  }
  function playersOf(src) {
    const o = {};
    for (const p of PLAYERS) o[p.id] = { x: +src[p.id].x, y: +src[p.id].y };
    return o;
  }
  // Frame model (v2): a frame is one shot. Its ball sits at the hit point, and its players are where
  // they END UP while that ball is in the air. Where they stood at the hit is the previous frame's
  // players (frame 1 keeps its own `start`).
  // Points saved before v2 placed players at the hit moment instead; shifting them by one frame
  // keeps their animation identical.
  function migrateV1(fr) {
    const out = fr.map((f) => clone(f));
    out[0].start = playersOf(fr[0].pieces);
    fr.forEach((_, k) => {
      const src = fr[k + 1] || fr[k];
      for (const p of PLAYERS) out[k].pieces[p.id] = { ...src.pieces[p.id] };
    });
    return out;
  }
  function presetState(p) {
    return normalize({ pieces: p.pieces, shot: p.shot });
  }
  function defaultBounce(ball) {
    const x = Math.max(20, Math.min(90, W - ball.x));
    return ball.y > NET ? { x, y: 62 } : { x, y: 176 };
  }

      'hint.start': 'Start: place everyone where they stand before the serve (the ball follows the server). Choose deuce or ad here; “Serve” then draws the serve.',
      'hint.shot': 'Moving a player = where they go during this shot (faint circle = where they were at the hit, fine dots = an automatic move). × = where it bounces. Slide the ball along the previous shot’s line to choose where it is hit back (before × = a volley); the returner follows it.',
      'step.start': 'Start — Serve: {server} / Return: {receiver}, {side}',
      'step.serve': 'Serve: × in the diagonal box, ◇ curve, ○ bounce',
      'step.shot': 'Shot {n}: ×, and where players move meanwhile',

      'piece.ball': 'Ball',
      'piece.player': 'Player {label}',
      'handle.land': 'Bounce spot',
      'handle.bend': 'Serve curve',
      'handle.dir': 'Direction after the bounce',

      'toast.serve': 'Shot 1: set × and how players move during the serve',
      'toast.shot': 'Shot {n}: slide the ball to where it’s hit back, then set × and the moves',
      'toast.deleted': 'Shot deleted',
      'toast.storage': 'Couldn’t save (storage is not available)',
      'toast.sampleCopied': 'Sample copied to your list',
      'toast.created': 'Created “{name}”',
      'toast.opened': 'Opened “{name}”',
      'toast.resumed': 'Continuing “{name}” ({shots})',
      'toast.broken': 'This data is damaged and can’t be loaded',
      'toast.formationSaved': 'Saved “{name}” to My formations',
      'confirm.deletePoint': 'Delete the point “{name}”?',
      'confirm.deleteFormation': 'Delete my formation “{name}”?',
      'prompt.pointName': 'Point name',
      'prompt.formationName': 'Name of this formation',
    },
  };

  // Each language's name, written in that language (for the switch in the 「…」 menu).
  const LANG_NAMES = { ja: '日本語', en: 'English' };

  // A saved choice wins; otherwise the device's first language we have, else English.
  function pickLang(saved, deviceLangs = []) {
    if (saved && STRINGS[saved]) return saved;
    for (const l of deviceLangs) {
      const base = String(l || '').toLowerCase().split('-')[0];
      if (STRINGS[base]) return base;
    }
    return 'en';
  }

  function tr(lang, key, vars = {}) {
    let v = (STRINGS[lang] || STRINGS.ja)[key];
    if (v === undefined) return key;
    if (typeof v === 'object') v = vars.n === 1 ? v.one : v.other;
    return v.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? String(vars[k]) : m));
  }

  // Who the players are, per point: the event (men's / women's / mixed doubles) and which player of each pair is
  // 「1」 / 「A」 (the other is 「2」 / 「B」). In mixed doubles 1 / A is the man and 2 / B the woman.
  // The pieces keep their ids (p1, p2, A, B) — this only says which number (and colour) each one shows, so picking
  // who serves or who returns on the deuce side never moves anyone.

  const KINDS = ['men', 'women', 'mixed'];
  // first: the piece shown as 1 / A of each pair.
  const defaultPeople = () => ({ kind: 'men', first: { own: 'p1', opp: 'A' } });
  function normalizePeople(v) {
    const d = defaultPeople();
    if (!v || typeof v !== 'object') return d;
    const ids = (team) => PLAYERS.filter((p) => p.team === team).map((p) => p.id);
    const first = v.first || v.men || {}; // points saved before 1 / 2 could be picked in every event: men = the man of each pair
    return {
      kind: KINDS.includes(v.kind) ? v.kind : d.kind,
      first: {
        own: ids('own').includes(first.own) ? first.own : d.first.own,
        opp: ids('opp').includes(first.opp) ? first.opp : d.first.opp,
      },
    };
  }
  const playerOf = (id) => PLAYERS.find((x) => x.id === id);
  const partnerOf = (id) => PLAYERS.find((x) => x.team === playerOf(id).team && x.id !== id);
  // 0 = shown as 1 / A, 1 = shown as 2 / B.
  const numberOf = (people, id) => (people.first[playerOf(id).team] === id ? 0 : 1);
  // 'm' / 'w' in mixed doubles (1 / A is the man), else null (everyone is of the event's sex, nothing to mark).
  function genderOf(people, id) {
    if (people.kind !== 'mixed' || !playerOf(id) || playerOf(id).team === 'ball') return null;
    return numberOf(people, id) === 0 ? 'm' : 'w';
  }
  // Makes player id number n (0: 1 / A, 1: 2 / B) of their pair; the partner gets the other.
  function setNumber(people, id, n) {
    const p = playerOf(id);
    if (!p || p.team === 'ball') return people;
    return { ...people, first: { ...people.first, [p.team]: n === 0 ? id : partnerOf(id).id } };
  }
  // The two of a pair swap numbers (and, in mixed doubles, who is the man).
  const swapPair = (people, id) => setNumber(people, id, 1 - numberOf(people, id));
  // The player returning on the deuce side: the receiver now (at the back) on a deuce point, the partner on an ad point.
  const deuceReceiver = (side, receiverId) => (side === 'deuce' ? receiverId : partnerOf(receiverId).id);
  // What a player is shown as: number (label) and colour key (a player id in PLAYER_COLORS). They belong to the
  // person — 1 / A in the first colour of the pair, 2 / B in the second — so swapping keeps each person's look.
  function displayOf(people, id) {
    const p = playerOf(id);
    if (!p || p.team === 'ball') return null;
    const q = PLAYERS.filter((x) => x.team === p.team)[numberOf(people, id)];
    return { label: q.label, color: q.id };
  }

  // Ball flight along a shot and how players move during playback (pure timing / geometry).

  // ---- Ball flight of shot `a` up to its return point c, via × only if it is reached.
  // span = share of the full simulated leg actually flown (the height arc is cut there).
  function legsFor(a, c) {
    const T = SHOT_TYPES[a.shot.type], g = geom(a), lob = a.shot.type === 'lob';
    const leg0 = (tEnd) => ({ p: g.a, q: leg0At(g, tEnd), at: g.ctrl ? (u) => leg0At(g, u * tEnd) : null, peak: T.peak[0], lob, span: tEnd });
    if (c.leg === 0) return [leg0(c.t)];
    return [leg0(1), { p: g.b, q: catchPoint(a, c), peak: T.peak[1], span: Math.min(1, c.t), afterBounce: true }];
  }
  // The rest of the simulated line past the return point (drawn faintly as the rail it can slide on).
  function railAfter(a, c) {
    const g = geom(a), pts = [catchPoint(a, c)];
    if (c.leg === 0) {
      for (let i = 1; i <= 8; i++) pts.push(leg0At(g, c.t + ((1 - c.t) * i) / 8));
      if (a.shot.bounce) pts.push(catchPoint(a, { leg: 1, t: 1 }));
    } else if (c.t < 1) pts.push(catchPoint(a, { leg: 1, t: 1 }));
    return pts.length > 1 ? pts : null;
  }
  // Height of the ball along a leg (0..1): an arc over the full simulated leg, cut at the return point.
  const heightAt = (leg, v) => { const s = v * (leg.span ?? 1); return leg.peak * 4 * s * (1 - s); };
  const legPoint = (leg, u) => (leg.at ? leg.at(u) : { x: lerp(leg.p.x, leg.q.x, u), y: lerp(leg.p.y, leg.q.y, u) });
  function legLen(leg) {
    if (!leg.at) return Math.hypot(leg.q.x - leg.p.x, leg.q.y - leg.p.y);
    let s = 0, prev = leg.p;
    for (let i = 1; i <= 16; i++) { const q = leg.at(i / 16); s += Math.hypot(q.x - prev.x, q.y - prev.y); prev = q; }
    return s;
  }

  const REACT = 0.2; // share of the flight the receiving side needs to read the shot before moving

  // The team of whoever stands closest to the ball at the moment of the hit.
  function hittingTeam(at, ball) {
    let best = null, bestD = Infinity;
    for (const p of PLAYERS) {
      const d = Math.hypot(at[p.id].x - ball.x, at[p.id].y - ball.y);
      if (d < bestD) { best = p.team; bestD = d; }
    }
    return best;
  }
  // Receiving side: waits to react, then accelerates and reaches its spot together with the ball
  // (never ahead of it). The hitting side just recovers position with an ease-in-out.
  function chase(u) {
    const t = Math.max(0, (u - REACT) / (1 - REACT));
    return Math.pow(t, 1.3);
  }

  // Only the receiver may return a serve: the receiving player at the back (the partner stands in front).
  function serveReceiver(st, from) {
    const team = hittingTeam(from, st.pieces.ball);
    const [a, b] = PLAYERS.filter((p) => p.team !== team);
    return Math.abs(from[a.id].y - NET) >= Math.abs(from[b.id].y - NET) ? a : b;
  }
  // Where the next shot is hit by default: on this shot's line, just in front (net side) of the receiving
  // player closest to the line (the receiver, for a serve). from = players when st was hit (to tell who
  // hit it), to = where they are when the ball arrives.
  const FRONT = 10; // the ball is met about 1m in front of the body
  function defaultReturn(st, from, to) {
    const team = hittingTeam(from, st.pieces.ball), only = isServe(st) ? serveReceiver(st, from) : null;
    let best = null;
    for (const p of PLAYERS) {
      if (p.team === team || (only && p !== only)) continue;
      const pos = to[p.id], q = catchPoint(st, projectCatch(st, pos)), d = Math.hypot(q.x - pos.x, q.y - pos.y);
      if (!best || d < best.d) best = { d, pos };
    }
    const toNet = best.pos.y > NET ? -1 : 1;
    return projectCatch(st, { x: best.pos.x, y: best.pos.y + toNet * FRONT });
  }

  // Automatic moves while shot st is in the air, for the players the user has not moved themselves.
  // from = players when st was hit, ret = where the next shot is hit (the return point).
  // - The returner (the receiver for a serve, else the receiving player who starts closest to ret) runs to
  //   about 1m behind it.
  // - With shift on, the pairs move together: the hitting pair shifts sideways towards the side the ball
  //   went to (its centre to SHIFT of the way from the middle to the ball), and the returner's partner
  //   follows PARTNER of the returner's sideways run. Depths stay as they were.
  //   A shifted player stays in their half: not past the centre line nor out past the singles sideline
  //   (one already beyond is not moved further out). The returner runs to the ball wherever it is.
  const SHIFT = 0.5, PARTNER = 0.5;
  function keepHalf(fromX, toX) {
    const [lo, hi] = fromX < W / 2 ? [ALLEY, W / 2] : [W / 2, W - ALLEY];
    return Math.max(Math.min(fromX, lo), Math.min(Math.max(fromX, hi), toX));
  }
  function autoMoves(st, from, ret, { shift = true } = {}) {
    const hitTeam = hittingTeam(from, st.pieces.ball);
    const out = {};
    for (const p of PLAYERS) out[p.id] = { ...from[p.id] };
    const rec = PLAYERS.filter((p) => p.team !== hitTeam), hit = PLAYERS.filter((p) => p.team === hitTeam);
    const r = returnerOf(st, from, ret);
    out[r.id] = returnSpot(r, ret);
    if (!shift) return out;
    const q = rec.find((p) => p !== r);
    out[q.id] = { x: keepHalf(from[q.id].x, from[q.id].x + (out[r.id].x - from[r.id].x) * PARTNER), y: from[q.id].y };
    const centre = (from[hit[0].id].x + from[hit[1].id].x) / 2, target = W / 2 + (ret.x - W / 2) * SHIFT;
    for (const p of hit) out[p.id] = { x: keepHalf(from[p.id].x, from[p.id].x + target - centre), y: from[p.id].y };
    return out;
  }

  // Who hits the next shot at ret: the receiver for a serve, else the receiving player who starts nearest.
  function returnerOf(st, from, ret) {
    if (isServe(st)) return serveReceiver(st, from);
    const team = hittingTeam(from, st.pieces.ball), dist = (a) => Math.hypot(a.x - ret.x, a.y - ret.y);
    const [a, b] = PLAYERS.filter((p) => p.team !== team);
    return dist(from[a.id]) <= dist(from[b.id]) ? a : b;
  }
  // Where the returner stands to hit the ball at ret: about 1m behind it, on their side of the net.
  const returnSpot = (player, ret) => keepOnSide(player.team, { x: ret.x, y: ret.y + (ret.y > NET ? FRONT : -FRONT) });

  // Language of the screen: texts come from src/model/strings.js through t(key, slots).
  // Part of one script with src/model/* (see tools/build.js): names are shared, no imports.
  const LS_LANG = 'tennisBoard.lang';
  let lang = (() => {
    let saved = null;
    try { saved = localStorage.getItem(LS_LANG); } catch (_) {}
    return pickLang(saved, navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language]);
  })();
  const t = (key, vars) => tr(lang, key, vars);
  const sampleName = (smp) => t('sample.' + smp.id);
  // Texts written into src/index.html: data-i18n (text), data-i18n-title, data-i18n-aria, data-i18n-placeholder.
  function applyStaticText() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach((e) => { e.textContent = t(e.dataset.i18n); });
    document.querySelectorAll('[data-i18n-title]').forEach((e) => { e.title = t(e.dataset.i18nTitle); });
    document.querySelectorAll('[data-i18n-aria]').forEach((e) => { e.setAttribute('aria-label', t(e.dataset.i18nAria)); });
    document.querySelectorAll('[data-i18n-placeholder]').forEach((e) => { e.placeholder = t(e.dataset.i18nPlaceholder); });
  }
  applyStaticText();

  // The language switch in the 「…」 menu. The choice is kept for the next visit.
  function buildLangSeg() {
    $('lang-seg').append(...Object.keys(STRINGS).map((l) =>
      h('button', { className: 'btn small', lang: l, textContent: LANG_NAMES[l], dataset: { lang: l }, onclick: () => setLang(l) })));
    renderLangSeg();
  }
  function renderLangSeg() {
    document.querySelectorAll('[data-lang]').forEach((b) => setOn(b, b.dataset.lang === lang));
  }
  function setLang(l) {
    if (!STRINGS[l] || l === lang) return;
    lang = l;
    try { localStorage.setItem(LS_LANG, l); } catch (_) {}
    applyStaticText();
    labelPieces();
    renderLangSeg();
    if (viewingSample) { // the captions of a sample follow the language; that is not an edit of it
      frames.forEach((f, i) => { f.note = t(`sample.${viewingSample.id}.${i + 1}`); });
      lastSavedKey = dataKey(snapshot());
    }
    renderLists();
    render();
  }

  // What is on the board: the point being edited and the shot shown.
  // Part of one script with src/model/* (see tools/build.js): names are shared, no imports.
  const LS_FORMATIONS = 'tennisBoard.formations.v1';
  const LS_POINTS = 'tennisBoard.points.v1';


  // ---- State
  let board = presetState(PRESETS[0].items[0]);
  let activePreset = PRESETS[0].items[0].id;
  let frames = [];
  let cur = -1;          // frame shown on the board; while >= 0, `board` IS frames[cur] and edits go straight into it
  let playing = null;    // { raf, stop() } while animating
  let people = defaultPeople(); // the point's event, 「自分」 and (mixed doubles) who is the man of each pair

  // Drawing the court, the players, the ball, its lines and the movement arrows.
  // Part of one script with src/model/* (see tools/build.js): names are shared, no imports.
  // ---- DOM
  const $ = (id) => document.getElementById(id);
  const svg = $('court');
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs = {}, parent) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  };
  // HTML element: h('button', { className, textContent, disabled, title, dataset: {…}, aria: {…}, onclick }, ...children)
  function h(tag, props = {}, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === 'dataset') Object.assign(e.dataset, v);
      else if (k === 'aria') for (const [a, x] of Object.entries(v)) e.setAttribute('aria-' + a, x);
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else e[k] = v;
    }
    e.append(...kids);
    return e;
  }
  const f1 = (v) => v.toFixed(1);

  // ---- Court drawing
  function drawCourt() {
    const g = $('court-lines');
    el('rect', { x: 0, y: 0, width: W, height: L, fill: COLORS.court }, g);
    const s = { stroke: COLORS.chalk, 'stroke-width': 0.9, fill: 'none', 'stroke-linecap': 'round', opacity: 0.92 };
    el('rect', { x: 0, y: 0, width: W, height: L, ...s }, g);
    el('line', { x1: ALLEY, y1: 0, x2: ALLEY, y2: L, ...s }, g);
    el('line', { x1: W - ALLEY, y1: 0, x2: W - ALLEY, y2: L, ...s }, g);
    el('line', { x1: ALLEY, y1: NET - SVC, x2: W - ALLEY, y2: NET - SVC, ...s }, g);
    el('line', { x1: ALLEY, y1: NET + SVC, x2: W - ALLEY, y2: NET + SVC, ...s }, g);
    el('line', { x1: W / 2, y1: NET - SVC, x2: W / 2, y2: NET + SVC, ...s }, g);
    el('line', { x1: W / 2, y1: 0, x2: W / 2, y2: 2.5, ...s }, g);
    el('line', { x1: W / 2, y1: L - 2.5, x2: W / 2, y2: L, ...s }, g);
    // net
    el('line', { x1: -9, y1: NET, x2: W + 9, y2: NET, stroke: COLORS.chalk, 'stroke-width': 1.6, 'stroke-dasharray': '1.4 1.2', opacity: 0.85 }, g);
    el('circle', { cx: -9, cy: NET, r: 1.4, fill: COLORS.chalk }, g);
    el('circle', { cx: W + 9, cy: NET, r: 1.4, fill: COLORS.chalk }, g);
  }

  // ---- Pieces
  const pieceEls = {};
  let ballShadow, ballBody;
  const pieceLabel = (p) => (p.id === 'ball' ? t('piece.ball')
    : t('piece.player', { label: displayOf(people, p.id).label }) + (genderOf(people, p.id) ? ` (${t('gender.' + genderOf(people, p.id))})` : ''));
  // After a language change: the names read out for the pieces and handles.
  function labelPieces() {
    for (const id of HANDLES) pieceEls[id].setAttribute('aria-label', t('handle.' + id));
    for (const p of PIECES) pieceEls[p.id].setAttribute('aria-label', pieceLabel(p));
  }
  function buildPieces() {
    // an arrowhead in each player's colour for their moves
    const defs = svg.querySelector('defs');
    for (const p of PLAYERS) {
      const m = el('marker', { id: 'mk-' + p.id, viewBox: '0 0 10 10', refX: 7, refY: 5, markerWidth: 5, markerHeight: 5, orient: 'auto-start-reverse' }, defs);
      el('path', { d: 'M0,0 L10,5 L0,10 z', fill: PLAYER_COLORS[p.id] }, m);
    }
    const layer = $('layer-pieces');
    // Shot handles first so players and the ball draw over them.
    const handle = (id, label) => {
      const g = el('g', { class: 'piece handle', 'data-id': id, role: 'img', 'aria-label': label, display: 'none' }, layer);
      el('circle', { r: HANDLE_R, fill: 'transparent' }, g);
      pieceEls[id] = g;
      return g;
    };
    const lm = handle('land', t('handle.land'));
    el('circle', { r: 3.4, fill: 'rgba(0,0,0,.25)', stroke: COLORS.ball, 'stroke-width': 0.7, 'stroke-dasharray': '1.2 0.9' }, lm);
    el('path', { d: 'M-2,-2 L2,2 M2,-2 L-2,2', stroke: COLORS.ball, 'stroke-width': 1.1, 'stroke-linecap': 'round' }, lm);
    const bh = handle('bend', t('handle.bend'));
    el('path', { d: 'M0,-2.6 L2.6,0 L0,2.6 L-2.6,0 z', fill: COLORS.ball, 'fill-opacity': 0.85, stroke: '#1b2410', 'stroke-width': 0.5 }, bh);
    const dh = handle('dir', t('handle.dir'));
    el('circle', { r: 2.6, fill: 'rgba(0,0,0,.35)', stroke: COLORS.ball, 'stroke-width': 0.8 }, dh);
    for (const p of PIECES) {
      const g = el('g', { class: 'piece', 'data-id': p.id, role: 'img', 'aria-label': pieceLabel(p) }, layer);
      if (p.id === 'ball') {
        ballShadow = el('ellipse', { rx: R_BALL, ry: R_BALL * 0.55, fill: 'rgba(0,0,0,.45)', display: 'none' }, g);
        ballBody = el('g', {}, g);
        el('circle', { r: 9, fill: 'transparent' }, ballBody); // bigger hit target
        el('circle', { r: R_BALL, fill: COLORS.ball, stroke: '#1b2410', 'stroke-width': 0.6 }, ballBody);
      } else {
        el('circle', { r: R_PLAYER + 0.8, fill: 'rgba(0,0,0,.28)', cy: 0.9 }, g);
        el('circle', { class: 'body', r: R_PLAYER, fill: PLAYER_COLORS[p.id], stroke: '#1b2410', 'stroke-width': 0.7 }, g);
        const t = el('text', { class: 'mark', 'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': 8.5, 'font-weight': 700,
          fill: '#1b2410', 'pointer-events': 'none' }, g);
        t.textContent = p.label;
        // mixed doubles: 「男」 / 「女」 at the lower right
        const badge = el('g', { class: 'gender', transform: 'translate(5.6 5.6)', display: 'none', 'pointer-events': 'none' }, g);
        el('circle', { r: 3.4, fill: COLORS.chalk, stroke: '#1b2410', 'stroke-width': 0.5 }, badge);
        el('text', { 'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': 4.2, 'font-weight': 700, fill: '#1b2410' }, badge);
      }
      pieceEls[p.id] = g;
    }
  }

  // h = ball height 0..1; drawn as a lifted, enlarged ball over its ground shadow.
  function renderPieces(pieces, h = 0) {
    for (const p of PIECES) {
      const pos = pieces[p.id];
      pieceEls[p.id].setAttribute('transform', `translate(${pos.x.toFixed(2)} ${pos.y.toFixed(2)})`);
    }
    ballShadow.setAttribute('display', h > 0.02 ? '' : 'none');
    ballBody.setAttribute('transform', h > 0.001 ? `translate(0 ${(-h * 12).toFixed(2)}) scale(${(1 + h * 0.9).toFixed(3)})` : '');
  }

  // ---- Handles for the shot on the board: × (bounce spot), ◇ and ○ (serve shape).
  const HANDLES = ['land', 'bend', 'dir'];
  const HANDLE_R = 5.5;
  const nextFrame = () => (cur >= 0 ? frames[cur + 1] : null);
  // "スタート" step: where everyone stands before the first hit (frame 1's start) and where the ball is served
  // from. It is shown when cur === -1; with no frames yet it is simply the board itself.
  const inSetup = () => cur < 0 && frames.length > 0;
  function setupBoard() {
    const f = frames[0];
    return { pieces: { ...playersOf(f.start || f.pieces), ball: { ...f.pieces.ball } }, shot: clone(f.shot) };
  }
  // Edits made on the スタート step go to frame 1. A player who did not move during the serve keeps not moving.
  function moveInSetup(id, pos) {
    const f = frames[0];
    board.pieces[id] = pos;
    if (id === 'ball') {
      f.pieces.ball = clampServeBall(f.shot.serve.side, pos);
      f.shot.land = clampLand(f, f.shot.land);
      board.pieces.ball = { ...f.pieces.ball };
      board.shot = clone(f.shot);
      resyncAfterServe();
      return;
    }
    const start = f.start || (f.start = playersOf(f.pieces));
    const old = start[id];
    if (Math.hypot(f.pieces[id].x - old.x, f.pieces[id].y - old.y) < 0.5) f.pieces[id] = { ...pos };
    start[id] = { ...pos };
  }
  // Where the current shot is returned: the next frame's catch, or the whole line when nothing follows yet.
  const currentCatch = () => (nextFrame() ? nextFrame().catch : fullCatch(board));
  function handlePos(id) {
    if (id === 'land') return board.shot.land;

  function resyncAfterServe() {

  function renderHandles(show) {
    for (const id of HANDLES) {

      if (pos) g.setAttribute('transform', `translate(${pos.x.toFixed(2)} ${pos.y.toFixed(2)})`);

  // ---- Drawing the ball's flight
  const legD = (leg, u = 1) => {

    return d;
  };
  // style: 'past' = the previous shot (faded), 'guide' = the shot being edited, 'live' = ball in the air.

  // arrow: an arrowhead at the end (only where the shot's line ends, see renderTrail).
  function drawLeg(layer, leg, type, u = 1, style = 'live', arrow = true) {

  function drawBounceMark(layer, pt) {

      class: 'bounce-mark', stroke: COLORS.ball, 'stroke-width': 1, 'stroke-linecap': 'round', opacity: 0.6 }, layer);
  }
  // Only the previous shot is kept on screen; older ones made the court unreadable.
  const recent = (upTo) => frames.slice(Math.max(0, upTo - 1), upTo + 1);
  function drawRail(layer, pts, style) {
    if (!pts) return;
    el('path', { d: 'M' + pts.map((q) => f1(q.x) + ',' + f1(q.y)).join(' L'), class: 'rail', fill: 'none', stroke: COLORS.ball,
      'stroke-width': 0.6, 'stroke-linecap': 'round', opacity: 0.3 }, layer); // thin and faint: not to be mistaken for a flight
    // The shot's arrowhead stays at the end of its line, even when the ball is taken earlier.
    const p = pts[pts.length - 2], q = pts[pts.length - 1];
    el('path', { d: `M${f1(p.x)},${f1(p.y)} L${f1(q.x)},${f1(q.y)}`, class: 'arrow-tip', fill: 'none', stroke: COLORS.ball, 'stroke-opacity': 0,
      'stroke-width': 1.25, opacity: style === 'guide' ? 0.75 : 0.45, 'marker-end': 'url(#mk-ball)' }, layer);
  }
  // Where the next shot takes the ball, when that is before the end of the line.
  function drawCatchMark(layer, pt) {
    el('circle', { cx: f1(pt.x), cy: f1(pt.y), r: 2.4, class: 'catch-mark', fill: 'none', stroke: COLORS.ball, 'stroke-width': 0.7, opacity: 0.9 }, layer);
  }
  // states: consecutive frames, the last one being on the board; its shot is drawn as the guide.
  // live: { a, c, li, v } = shot currently in the air during playback.
  function renderTrail(states, live) {
    const layer = $('layer-trail');
    layer.replaceChildren();
    for (let k = 0; k + 1 < states.length; k++) {
      const a = states[k], c = states[k + 1].catch || fullCatch(a), rail = live ? null : railAfter(a, c);
      drawFlight(layer, a, c, 'past', rail);

    }
    if (live) {
      legsFor(live.a, live.c).forEach((leg, i) => { if (i <= live.li) drawLeg(layer, leg, live.a.shot.type, i < live.li ? 1 : live.v); });

  // The ball's flight up to where it is taken. Arrowheads: at × when the ball gets there, and at the end of
  // the line when nothing of the line is left over (else the rail after it carries the arrowhead).
  function drawFlight(layer, a, c, style, rail) {
    const legs = legsFor(a, c);
    legs.forEach((leg, i) => drawLeg(layer, leg, a.shot.type, 1, style, i < legs.length - 1 || !rail));
  }

  // Where the players of frame k stood when its ball was hit.
  function startOf(k) {
    if (k > 0) return frames[k - 1].pieces;
    const f = k === 0 ? frames[0] : board;
    return f.start || f.pieces;
  }
  const ghostShown = (pid) => {
    if (cur < 0 || playing) return false;
    const a = startOf(cur)[pid], b = board.pieces[pid];
    return Math.hypot(b.x - a.x, b.y - a.y) >= 3;
  };

  // ---- Player movement during this frame's shot: ghost where they stood at the hit + arrow to where they go.
  // Ghosts are draggable: they edit the hit-moment position (the previous frame's players).
  function renderMoves(from, now) {
    const layer = $('layer-moves');
    layer.replaceChildren();
    if (!from) return;
    for (const p of PLAYERS) {
      const a = from[p.id], b = now.pieces[p.id];
      const d = Math.hypot(b.x - a.x, b.y - a.y);
      if (d < 3) continue;
      const look = displayOf(people, p.id), color = PLAYER_COLORS[look.color];
      el('circle', { cx: a.x, cy: a.y, r: R_PLAYER, class: 'piece ghost', 'data-id': 'ghost-' + p.id, fill: color, 'fill-opacity': 0.14, stroke: color,
        'stroke-opacity': 0.55, 'stroke-width': 0.6, 'stroke-dasharray': '1.5 1.2' }, layer);

        el('line', { x1: f1(a.x + ux * R_PLAYER), y1: f1(a.y + uy * R_PLAYER), x2: f1(b.x - ux * (R_PLAYER + 2)), y2: f1(b.y - uy * (R_PLAYER + 2)),
          class: 'move' + (auto ? ' auto' : ''), 'data-id': 'move-' + p.id,

  function renderCaption(text, hint = false) {

  }

  // Number and colour follow the person (see displayOf); mixed doubles also get 「男」 / 「女」.
  function renderPeople() {
    for (const p of PLAYERS) {
      const g = pieceEls[p.id], gender = genderOf(people, p.id), look = displayOf(people, p.id);
      g.querySelector('circle.body').setAttribute('fill', PLAYER_COLORS[look.color]);
      g.querySelector('text.mark').textContent = look.label;

  }

    renderControls();

  }
  // Cheap redraw while dragging.
  function renderLive() {

    renderTrail(cur >= 0 ? recent(cur) : []);
    renderMoves(cur >= 0 ? startOf(cur) : null, board);
  }

  // The スタート step: who serves and who returns, from which side (with 男 / 女 in mixed doubles).
  function startSummary() {

    const who = (id) => {

  // Button states for the shot shown.
  // Part of one script with src/model/* (see tools/build.js): names are shared, no imports.
  // ---- Controls state

  function renderControls() {

    renderShotRows(busy);
    renderFrameStrip(busy);

  }
  // Moving between shots, playback and the 「…」 actions.
  function renderNav(busy) {
    const n = frames.length;
    $('frame-info').innerHTML = cur < 0
      ? `<span class="start-label">${t('nav.start')}</span>${n ? `<span class="of">/ ${n}</span>` : ''}`
      : `${t('nav.shotN', { n: cur + 1 })}<span class="of">/ ${n}</span>`;

    $('btn-prev').disabled = busy || cur < 0 || !n;
    $('btn-next').disabled = busy || cur >= n - 1;
    $('btn-last').disabled = busy || cur >= n - 1;
    $('btn-play').disabled = !canPlay();
    $('btn-play').textContent = t(busy ? 'nav.stop' : 'nav.play');
    $('btn-del-frame').disabled = busy || cur < 0;
    for (const id of ['btn-add-frame', 'btn-reset-point', 'btn-copy-here', 'btn-export', 'btn-import', 'btn-save-formation', 'btn-menu-save-formation', 'btn-presets', 'btn-new-point']) {

    $('copy-here-label').textContent = cur < 0 ? t('menu.copyStart') : t('menu.copyUpTo', { n: cur + 1 });
    document.body.classList.toggle('at-start', cur < 0);
    // The point on screen stays un-openable (its row is redrawn only when the list is saved).
    document.querySelectorAll('#presets button, .saved-list button, [data-shot]').forEach((b) => {
      b.disabled = busy || (b.classList.contains('open') && !!b.closest('li.current'));

  }
  const setOn = (b, on) => { b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); };
  // 1打目 (and the スタート step) show the serve row; later shots the rally row.
  function renderShotRows(busy) {
    document.querySelectorAll('[data-shot]').forEach((b) => setOn(b, b.dataset.shot === board.shot.type));

    $('rally-row').hidden = serveView;
    $('serve-row').hidden = !serveView;
    $('shot-title').textContent = t(serveView ? 'shot.titleServe' : 'shot.title');

    document.querySelectorAll('[data-serve]').forEach((b) => { setOn(b, b.dataset.serve === st.shot.type); b.disabled = busy; });

  }

  function markEdited() {
    activePreset = null;
    renderPresets();
  }

  // Dragging players, the ball and the shot handles.
  // Part of one script with src/model/* (see tools/build.js): names are shared, no imports.
  // ---- Pointer interaction
  function toSvg(evt) {
    const pt = svg.createSVGPoint();
    pt.x = evt.clientX; pt.y = evt.clientY;
    const m = svg.getScreenCTM();
    return m ? pt.matrixTransform(m.inverse()) : { x: 0, y: 0 };

  const clampX = (x) => Math.max(VB.x + 3, Math.min(VB.x + VB.w - 3, x));
  const clampY = (y) => Math.max(VB.y + 3, Math.min(VB.y + VB.h - 3, y));

  const isGhost = (id) => id.startsWith('ghost-');

  let gesture = null;

  svg.addEventListener('pointerdown', (e) => {

    const p = toSvg(e);
    if (!e.target.closest('.piece')) return;
    // Hit areas overlap (the ball's is enlarged for touch), so pick the nearest piece centre.
    const id = pieceAt(p);
    if (!id) return;
    const pieceEl = pieceEls[id];
    const pos = posOf(id);
    // Players stay on their side of the net; before the serve the server also stays in the serving spot.
    const team = TEAM_OF[isGhost(id) ? id.slice(6) : id], serveLimit = serveSpotLimit(id);
    const limit = team === 'own' || team === 'opp' ? (q) => { const s = keepOnSide(team, q); return serveLimit ? serveLimit(s) : s; } : serveLimit;
    gesture = { id: e.pointerId, piece: id, dx: pos.x - p.x, dy: pos.y - p.y, moved: false, limit, from: p, far: 0 };

    if (cur < 0 && id === serverId(board)) gesture.ballOff = { x: board.pieces.ball.x - pos.x, y: board.pieces.ball.y - pos.y };

    if (!cancelled && g.far < 1.5 && cur < 0 && TEAM_OF[g.piece] && TEAM_OF[g.piece] !== 'ball') {

  // Until the serve is hit the server stays where a serve may be hit from: on the スタート step, and as the
  // hit-moment spot (ghost) on 1打目. Where they move while it flies (serve and volley) is free.
  function serveSpotLimit(id) {
    if (cur > 0) return null;
    const st = serveState(), pid = cur < 0 ? id : isGhost(id) ? id.slice(6) : null;
    if (!pid || pid !== serverId({ pieces: { ...(cur < 0 ? board.pieces : startOf(0)), ball: st.pieces.ball } })) return null;
    return (pos) => clampServeSpot(st.shot.serve.side, servesUp(st.pieces.ball), pos);
  }
  // The same for an arrangement put on the スタート step (a マイ陣形 may have been saved with the server anywhere).
  function keepServerInPlace() {
    const st = serveState(), sid = serverId({ pieces: { ...(st.start || st.pieces), ball: st.pieces.ball } });
    const fix = (set) => { set[sid] = clampServeSpot(st.shot.serve.side, servesUp(st.pieces.ball), set[sid]); };
    if (inSetup()) { fix(st.start); fix(st.pieces); board = setupBoard(); } else fix(board.pieces);
  }
  function moveTo(id, pos) {
    if (inSetup()) { if (!isHandle(id) && !isGhost(id)) moveInSetup(id, pos); return; }
    if (id === 'land') { board.shot.land = isServe(board) ? clampLand(board, pos) : pos; syncNextBall(); }
    else if (id === 'bend') { setServeBend(board, pos); syncNextBall(); }
    else if (id === 'dir') { setServeAfter(board, pos); syncNextBall(); }
    else if (isGhost(id)) {
      const pid = id.slice(6);
      if (cur > 0) { frames[cur - 1].pieces[pid] = pos; setManual(frames[cur - 1], pid); }

    } else {
      board.pieces[id] = pos;
      if (id !== 'ball') setManual(board, id); // the user decides this player's move from now on
      if (id === 'ball' && isServe(board)) { // the serve is hit from a legal spot and lands in the box
        board.pieces.ball = clampServeBall(board.shot.serve.side, pos);

      } else if (id === 'ball') { snapBallToPrev(); syncNextBall(); } // return point stays on the incoming line
    }
  }

  // Handles are small and placed on purpose, so they win over a player or ball underneath.
  function pieceAt(p) {
    const nearest = (ids, radius) => {
      let best = null, bestD = Infinity;
      for (const id of ids) {
        const q = posOf(id);
        if (!q) continue;
        const d = Math.hypot(q.x - p.x, q.y - p.y);
        if (d <= radius(id) && d < bestD) { best = id; bestD = d; }
      }
      return best;
    };
    return nearest(playing || cur < 0 ? [] : HANDLES, () => HANDLE_R)
      || nearest(PIECES.map((pc) => pc.id), (id) => (id === 'ball' ? 9 : R_PLAYER + 1))
      || nearest(PLAYERS.filter((pc) => ghostShown(pc.id)).map((pc) => 'ghost-' + pc.id), () => R_PLAYER);
  }

  // 陣形 / マイ陣形 (start arrangements) and loading a sample.
  // Part of one script with src/model/* (see tools/build.js): names are shared, no imports.
  // ---- 陣形 (only on the スタート step): built-in arrangements plus the user's 「マイ陣形」.
  function renderPresets() {
    const busy = !!playing;
    const group = (label, ...items) => h('div', { className: 'preset-group' }, h('div', { className: 'label', textContent: label }), h('div', { className: 'row' }, ...items));
    const presetBtn = (id, name, onclick, dataset) =>
      h('button', { className: 'btn small preset' + (id === activePreset ? ' active' : ''), textContent: name, onclick, dataset, disabled: busy });
    const mine = readList(LS_FORMATIONS);
    const tagged = (cls, e) => { e.classList.add(cls); return e; };
    const seg = (items) => h('div', { className: 'seg' }, ...items.map(([text, on, onclick, dataset]) =>
      h('button', { className: 'btn small' + (on ? ' on' : ''), textContent: text, disabled: busy, onclick, dataset, aria: { pressed: String(on) } })));
    // Seen from our pair (1・2): do we serve or return? Then the event, who serves and who returns on the deuce side,
    // and the 陣形 of that scene.
    const scene = sceneOf();
    $('presets').replaceChildren(
