  const LS_LIBRARY = 'tennisBoard.library.v1';
  const LS_DRAFT = 'tennisBoard.draft.v1'; // pre-list work in progress, imported once
  let library = { v: 1, currentId: null, points: [] };
  let viewingSample = null; // a sample on screen; it joins the list only once edited
  let lastSavedKey = null;
  let saveTimer = 0;
  const currentPoint = () => library.points.find((x) => x.id === library.currentId) || null;
  const snapshot = () => ({ ...(frames.length ? { frames: clone(frames), start: null, cur } : { frames: [], start: clone(board), cur: -1 }), people: clone(people) });
  const dataKey = (snap) => JSON.stringify([snap.frames, snap.start, snap.people]); // what counts as an edit (not cur)
  function writeLibrary() {
    try { localStorage.setItem(LS_LIBRARY, JSON.stringify(library)); } catch (_) { /* storage unavailable */ }
  }
  function makePoint(name, snap, origin) {
    const now = Date.now();
    return { id: uid(), name, createdAt: now, updatedAt: now, v: 2, frames: snap.frames, start: snap.start, cur: snap.cur, people: snap.people || clone(people), ...(origin ? { origin } : {}) };
  }
  function nextName(base = t('point.base')) {
    const names = new Set(library.points.map((x) => x.name));
    let i = library.points.length + 1;
    while (names.has(`${base} ${i}`)) i++;
    return `${base} ${i}`;
  }
  function saveNow() {
    clearTimeout(saveTimer);
    saveTimer = 0;
    if (playing) return;
    const snap = snapshot(), key = dataKey(snap);
    if (viewingSample) {
      if (key === lastSavedKey) return; // an untouched sample is not kept
      const p = makePoint(sampleName(viewingSample), snap, { sample: true, name: t('sample.label') });
      library.points.unshift(p);
      library.currentId = p.id;
      viewingSample = null;
      toast(t('toast.sampleCopied'));
    } else {
      let p = currentPoint();
      if (!p) { p = makePoint(nextName(), snap); library.points.unshift(p); library.currentId = p.id; }
      p.cur = snap.cur;
      if (key !== lastSavedKey) { p.frames = snap.frames; p.start = snap.start; p.people = snap.people; p.updatedAt = Date.now(); }
    }
    lastSavedKey = key;
    writeLibrary();
    renderPointList();
  }
  function queueDraftSave() {
    if (playing) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow, 250);
  }
  // iOS can drop a page in the background without warning, so flush when it is hidden.
  addEventListener('pagehide', () => { if (saveTimer) saveNow(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && saveTimer) saveNow(); });

  function openPoint(p) {
    if (playing) playing.stop(false);
    let fr = Array.isArray(p.frames) && p.frames.every(isValidState) ? p.frames.map(normalize) : [];
    if (fr.length && !(p.v >= 2)) fr = migrateV1(fr);
    frames = fixCatches(fr);
    if (frames.length) {
      cur = Math.max(-1, Math.min(frames.length - 1, Number.isInteger(p.cur) ? p.cur : 0));
      board = cur < 0 ? setupBoard() : frames[cur];
    } else {
      cur = -1;
      board = ensureServe(normalize(p.start && isValidState(p.start) ? p.start : presetState(PRESETS[0].items[0])));
      stripCatch(board);
    }
    people = normalizePeople(p.people); // older points: no one marked as 「自分」
    library.currentId = p.id;
    viewingSample = null;
    activePreset = null;
    lastSavedKey = dataKey(snapshot());
    writeLibrary();
    renderPresets();
    render();
    renderPointList();
  }
  // The スタート arrangement of the point on screen, as the start of a point with no shots yet.
  function startArrangement() {
    const start = ensureServe(clone(frames.length ? setupBoard() : board));
    stripCatch(start);
    return start;
  }
  // 新規: a fresh point starting from the current スタート arrangement; the old one stays in the list.
  function newPointFromHere() {
    if (playing) playing.stop(false);
    saveNow();
    const p = makePoint(nextName(), { frames: [], start: startArrangement(), cur: -1, people: clone(people) }); // same players as now
    library.points.unshift(p);
    openPoint(p);
    toast(t('toast.created', { name: p.name }));
  }
  // Whole copy of a listed point; it opens right away.
  function copyPoint(src) {
    saveNow();
    const p = makePoint(t('point.copyName', { name: src.name }), { frames: clone(src.frames), start: src.start ? clone(src.start) : null, cur: src.cur, people: normalizePeople(src.people) },
      { id: src.id, name: src.name });
    p.v = src.v;
    library.points.unshift(p);
    openPoint(p);
    toast(t('toast.created', { name: p.name }));
  }
  // 「ここからコピー」: スタート up to the shown shot becomes a new point (shot 0 = スタート only).
  function copyHere() {
    saveNow();
    const src = viewingSample ? { id: null, name: t('point.sampleSrc', { name: sampleName(viewingSample) }) } : currentPoint();
    if (!src) return;
    const upto = cur + 1;
    const snap = { ...(upto ? { frames: clone(frames.slice(0, upto)), start: null, cur: upto - 1 } : { frames: [], start: startArrangement(), cur: -1 }), people: clone(people) };
    const p = makePoint(upto ? t('point.fromShot', { name: src.name, n: upto }) : t('point.fromStart', { name: src.name }), snap, { id: src.id, name: src.name, shot: upto });
    library.points.unshift(p);
    openPoint(p);
    toast(t('toast.created', { name: p.name }));
  }
  function deletePoint(p) {
    if (!confirm(t('confirm.deletePoint', { name: p.name }))) return;
    library.points = library.points.filter((x) => x.id !== p.id);
    if (library.currentId === p.id && !viewingSample) {
      const next = [...library.points].sort((a, b) => b.updatedAt - a.updatedAt)[0];
      if (next) openPoint(next);
      else { library.currentId = null; newPointFromHere(); }
    }
    writeLibrary();
    renderPointList();
  }
  // Most recently touched first; copies sit right under the point they came from.
  function orderedPoints() {
    const byTime = [...library.points].sort((a, b) => b.updatedAt - a.updatedAt);
    const ids = new Set(library.points.map((x) => x.id));
    const kids = new Map();
    for (const x of byTime) if (x.origin && x.origin.id && ids.has(x.origin.id)) (kids.get(x.origin.id) || kids.set(x.origin.id, []).get(x.origin.id)).push(x);
    const out = [];
    const walk = (x, depth) => { out.push({ p: x, depth }); for (const c of kids.get(x.id) || []) walk(c, depth + 1); };
    for (const x of byTime) if (!(x.origin && x.origin.id && ids.has(x.origin.id))) walk(x, 0);
    return out;
  }
  function renderPointList() {
    const busy = !!playing;
    const ids = new Set(library.points.map((x) => x.id));
    const originText = (o) => (o && o.name
      ? ` · ${t('list.origin', { name: o.name })}${o.id && !ids.has(o.id) ? t('list.originDeleted') : ''}${o.shot ? t('list.originShot', { n: o.shot }) : o.shot === 0 ? t('list.originStart') : ''}` : '');
    const rows = orderedPoints().map(({ p, depth }) => {
      const isCur = p.id === library.currentId && !viewingSample;
      const meta = h('span', { className: 'meta', textContent: `${t('list.shots', { n: (p.frames || []).length })} · ${fmtDate(p.updatedAt)}${originText(p.origin)}` });
      if (isCur) meta.prepend(h('span', { className: 'tag', textContent: t('list.current') }));
      const small = (text, onclick, extra = {}) => h('button', { className: 'btn small', textContent: text, disabled: busy, onclick, ...extra });
      return h('li', { className: [depth && 'child', isCur && 'current'].filter(Boolean).join(' '), dataset: { id: p.id } },
        h('button', { className: 'open', disabled: isCur || busy, title: isCur ? t('list.current') : t('list.open', { name: p.name }),
          onclick: () => { saveNow(); openPoint(p); setOverlay(null); toast(t('toast.opened', { name: p.name })); } },
        h('span', { className: 'name', textContent: p.name }), meta),
        small(t('list.rename'), () => {
          const v = prompt(t('prompt.pointName'), p.name);
          if (v === null || !v.trim()) return;
          p.name = v.trim().slice(0, 40);
          writeLibrary();
          renderPointList();
        }, { aria: { label: t('list.renameAria', { name: p.name }) } }),
        small(t('list.copy'), () => { copyPoint(p); setOverlay(null); }),
        small(t('list.delete'), () => deletePoint(p), { className: 'btn small danger', aria: { label: t('list.deleteAria', { name: p.name }) } }));
    });
    $('list-points').replaceChildren(...rows);
    const input = $('point-name'), cp = currentPoint();
    if (document.activeElement !== input) input.value = viewingSample ? t('name.sample', { name: sampleName(viewingSample) }) : cp ? cp.name : '';
    input.placeholder = t('name.placeholder');
    input.disabled = !!viewingSample;
    document.title = t('app.docTitle', { name: viewingSample ? sampleName(viewingSample) : cp ? cp.name : '' });
    renderSamples();
  }
  // Samples: watching one does not add it to the list; editing it does (see saveNow).
  function renderSamples() {
    $('list-samples').replaceChildren(...SAMPLES.map((smp) => h('li', { className: viewingSample === smp ? 'current' : '' },
      h('span', { className: 'open' }, h('span', { className: 'name', textContent: sampleName(smp) }), h('span', { className: 'meta', textContent: `${t('list.shots', { n: smp.frames.length })} · ${t('sample.label')}` })),
      h('button', { className: 'btn small sample', textContent: t('sample.watch'), dataset: { sample: smp.id }, disabled: !!playing, onclick: () => loadSample(smp) }))));
  }
  $('point-name').addEventListener('keydown', (e) => { if (e.key === 'Enter') e.target.blur(); });
  $('point-name').addEventListener('blur', () => renderPointList());
  $('point-name').addEventListener('input', () => {
    const cp = currentPoint();
    if (!cp || viewingSample) return;
    cp.name = $('point-name').value.trim() || cp.name;
    writeLibrary();
    renderPointList();
  });
  $('btn-new-point').addEventListener('click', () => { newPointFromHere(); setOverlay(null); });

  // First run with the list: bring in the named points and the work in progress of older versions.
  function loadLibrary() {
    try {
      const v = JSON.parse(localStorage.getItem(LS_LIBRARY) || 'null');
      if (v && Array.isArray(v.points)) { library = { v: 1, currentId: v.currentId || null, points: v.points.filter((x) => x && x.id) }; return; }
    } catch (_) { /* fall through to a fresh list */ }
    const now = Date.now();
    readList(LS_POINTS).forEach((it, i) => {
      if (!Array.isArray(it.frames) || !it.frames.length) return;
      library.points.push({ id: it.id || uid(), name: it.name || `${t('point.base')} ${i + 1}`, createdAt: it.savedAt || now, updatedAt: it.savedAt || now,
        v: it.v >= 2 ? 2 : 1, frames: it.frames, start: null, cur: 0 });
    });
    let d = null;
    try { d = JSON.parse(localStorage.getItem(LS_DRAFT) || 'null'); } catch (_) { d = null; }
    if (d && Array.isArray(d.frames) && (d.frames.length || (d.board && isValidState(d.board)))) {
      const p = { id: uid(), name: t('point.resumed'), createdAt: now, updatedAt: now + 1, v: 2, frames: d.frames, start: d.frames.length ? null : d.board,
        cur: Number.isInteger(d.cur) ? d.cur : 0 };
      library.points.unshift(p);
      library.currentId = p.id;
    }
    writeLibrary();
  }

  // Read-only view of the point on screen, for tests and debugging.
  window.tennisBoardDebug = { snapshot: () => clone(snapshot()) };

  // ---- Export / import: a point as one line of text, to send it or keep a copy outside the browser.
  const EXPORT_TYPE = 'tennis-board-point';
  function exportText() {
    if (saveTimer) saveNow();
    const snap = snapshot(), cp = currentPoint();
    const name = viewingSample ? sampleName(viewingSample) : cp ? cp.name : t('point.base');
    return { name, text: JSON.stringify({ type: EXPORT_TYPE, v: 1, name, pv: 2, frames: snap.frames, start: snap.start, cur: snap.cur, people: snap.people }) };
  }
  function exportPoint() {
    if (playing) return;
    const { name, text } = exportText();
    // The Claude app on iPhone may not allow the clipboard: then the text is shown to copy by hand.
    const manual = () => prompt(t('prompt.exportManual'), text);
    try {
      navigator.clipboard.writeText(text).then(() => toast(t('toast.exported', { name })), manual);
    } catch (_) { manual(); }
  }
  function importPoint() {
    if (playing) return;
    const text = prompt(t('prompt.import'), '');
    if (text === null || !text.trim()) return;
    let d = null;
    try { d = JSON.parse(text.trim()); } catch (_) { d = null; }
    const frames = d && d.type === EXPORT_TYPE && Array.isArray(d.frames) ? d.frames : null;
    if (!frames || !(frames.length ? frames.every(isValidState) : isValidState(d.start))) { toast(t('toast.importBad')); return; }
    saveNow();
    const p = makePoint(String(d.name || t('point.base')).slice(0, 40), { frames, start: frames.length ? null : d.start, cur: Number.isInteger(d.cur) ? d.cur : 0, people: normalizePeople(d.people) });
    p.v = d.pv >= 2 ? 2 : 1;
    library.points.unshift(p);
    openPoint(p);
    toast(t('toast.imported', { name: p.name }));
  }
  $('btn-export').addEventListener('click', exportPoint);
  $('btn-import').addEventListener('click', importPoint);

  // Start-up.
  // Part of one script with src/model/* (see tools/build.js): names are shared, no imports.
  // ---- Init
  drawCourt();
  buildPieces();
  buildLangSeg();
  try { if (localStorage.getItem(LS_LIST_COLLAPSED)) document.body.classList.add('list-collapsed'); } catch (_) {}
  applyLayout();
  loadLibrary();
  const startPoint = currentPoint() || [...library.points].sort((a, b) => b.updatedAt - a.updatedAt)[0];
  renderLists();
  if (startPoint) {
    openPoint(startPoint);
    if (frames.length) toast(t('toast.resumed', { name: startPoint.name, shots: t('list.shots', { n: frames.length }) }));
  } else {
    ensureServe(board); // before any shot, the board is the serve being planned
    const p = makePoint(nextName(), snapshot());
    library.points.push(p);
    openPoint(p);
  }
})();
</script>
</body>
</html>
